name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # README image assets live outside the npm tarball (minimal `files`
      # whitelist) and are referenced by absolute URL (raw.githubusercontent
      # for bitmaps, jsDelivr /gh for SVGs). Rewrite @main to the SHA under
      # test so PRs validate their own state, then assert each URL resolves.
      # The README currently carries no such assets; an empty match set is a
      # pass, not a failure (grep exits 1 on no match under `set -e`).
      - name: README asset URLs resolve
        run: |
          set -euo pipefail
          urls="$(grep -hoE 'https://(raw\.githubusercontent\.com|cdn\.jsdelivr\.net/gh)/[^) ]+' README.md \
            | sort -u \
            | sed -E \
                -e "s#(raw\.githubusercontent\.com/alfiwillianz/omp-verdict-tiered)/main#\1/${GITHUB_SHA}#" \
                -e "s#(cdn\.jsdelivr\.net/gh/alfiwillianz/omp-verdict-tiered)@main#\1@${GITHUB_SHA}#" \
            || true)"
          if [ -z "$urls" ]; then
            echo "No README asset URLs to check."
            exit 0
          fi
          failed=0
          while read -r url; do
            if ! curl -fsSI --max-time 30 "$url" >/dev/null; then
              echo "::error::broken README asset: $url"
              failed=1
            fi
          done <<< "$urls"
          exit "$failed"

# trigger re-registration: touch v2
