name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # README image assets live outside the npm tarball (minimal `files`
      # whitelist) and are referenced by absolute URL (raw.githubusercontent
      # for bitmaps, jsDelivr /gh for SVGs). Rewrite @main to the SHA under
      # test so PRs validate their own state, then assert each URL resolves.
      - name: README asset URLs resolve
        run: |
          set -euo pipefail
          grep -hoE 'https://(raw\.githubusercontent\.com|cdn\.jsdelivr\.net/gh)/[^) ]+' README.md \
          | sort -u \
          | sed -E \
              -e "s#(raw\.githubusercontent\.com/alfiwillianz/pi-verdict-tiered)/main#\1/${GITHUB_SHA}#" \
              -e "s#(cdn\.jsdelivr\.net/gh/alfiwillianz/pi-verdict-tiered)@main#\1@${GITHUB_SHA}#" \
          | while read -r url; do
              if ! curl -fsSI --max-time 30 "$url" >/dev/null; then
                echo "::error::broken README asset: $url"
                exit 1
              fi
            done

